[project]
name = "maisonpolina"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "Django==5.2.16",
  "python-decouple==3.8",
  "gunicorn==23.0.0",
  "whitenoise==6.9.0",
  "psycopg2-binary==2.9.10",
  "Pillow==11.3.0",
  "django-htmx==1.23.0",
  "django-csp==4.0",
  "django-unfold==0.102.0",
  "argon2-cffi==25.1.0",
  "requests==2.34.2",
]

# Do not install this repo as a site-packages wheel — keep imports from project root.
[tool.uv]
package = false

[tool.vercel]
entrypoint = "wsgi:application"
