{% load i18n site_content %}
<section class="section" id="reviews" data-section="testimonials">
  <div class="container">
    <div class="testimonials__head" data-reveal>
      <p class="section__eyebrow">{% block_plain "home" "testimonials.eyebrow" %}</p>
      <div class="section__rule section__rule--center"></div>
    </div>
    {% if testimonials %}
    <div class="carousel" data-carousel data-reveal>
      <button type="button" class="carousel__btn" data-carousel-prev aria-label="{% trans 'Предыдущий отзыв' %}">
        <svg width="18" height="32" viewBox="0 0 18 32" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M15 2L3 16l12 14"></path></svg>
      </button>
      <div class="carousel__track-wrap">
        <div class="carousel__track" data-carousel-track>
          {% for item in testimonials %}
          <blockquote class="carousel__slide">
            <span class="carousel__quote-mark" aria-hidden="true">“</span>
            <p class="carousel__text">{{ item.text }}</p>
            <footer class="carousel__footer">
              <p class="carousel__name">{{ item.author_name }}</p>
              <p class="carousel__role">{{ item.role }}</p>
            </footer>
          </blockquote>
          {% endfor %}
        </div>
      </div>
      <button type="button" class="carousel__btn" data-carousel-next aria-label="{% trans 'Следующий отзыв' %}">
        <svg width="18" height="32" viewBox="0 0 18 32" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M3 2l12 14L3 30"></path></svg>
      </button>
    </div>
    <div class="carousel__dots" data-carousel-dots>
      {% for item in testimonials %}
      <button type="button" class="carousel__dot{% if forloop.first %} is-active{% endif %}" data-carousel-dot="{{ forloop.counter0 }}" aria-label="{% blocktrans with n=forloop.counter %}Отзыв {{ n }}{% endblocktrans %}"></button>
      {% endfor %}
    </div>
    {% endif %}
  </div>
</section>
