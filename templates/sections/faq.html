{% load i18n site_content %}
<section class="section section--alt" id="faq" data-section="faq">
  <div class="container">
    <div data-reveal>
      {% include "partials/section-heading.html" with key_prefix="faq" %}
    </div>
    <div class="accordion" data-accordion data-reveal data-reveal-delay="220">
      {% for item in faq_items %}
      <div class="accordion__item{% if forloop.first %} is-open{% endif %}">
        <button type="button"
                class="accordion__trigger"
                id="faq-trigger-{{ item.pk }}"
                aria-expanded="{% if forloop.first %}true{% else %}false{% endif %}"
                aria-controls="faq-panel-{{ item.pk }}"
                data-accordion-trigger>
          <span>{{ item.question }}</span>
          <span class="accordion__icon" aria-hidden="true"></span>
        </button>
        <div class="accordion__panel"
             id="faq-panel-{{ item.pk }}"
             role="region"
             aria-labelledby="faq-trigger-{{ item.pk }}">
          <div class="accordion__panel-inner">
            <div class="accordion__answer">{{ item.answer|richtext }}</div>
          </div>
        </div>
      </div>
      {% endfor %}
    </div>
    <div class="faq__cta">
      <button type="button" class="btn" data-open-lead data-source="faq" data-service="">
        {% block_plain "home" "faq.cta" %}
      </button>
    </div>
  </div>
</section>
