{% load static site_content %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE|default:'ru' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>{% block error_title %}{% endblock %}</title>
  <link rel="preload" href="{% static 'fonts/lora-400-cyr.woff2' %}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{% static 'fonts/lora-400.woff2' %}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{% static 'css/tokens.css' %}">
  <link rel="stylesheet" href="{% static 'css/fonts-lora.css' %}">
  <link rel="stylesheet" href="{% static 'css/reset.css' %}">
  <link rel="stylesheet" href="{% static 'css/typography.css' %}">
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
  <link rel="stylesheet" href="{% static 'css/components/button.css' %}">
  <link rel="stylesheet" href="{% static 'css/pages/privacy.css' %}">
  {% if section_styles_css %}
  <style id="cms-section-styles">{{ section_styles_css|safe }}</style>
  {% endif %}
</head>
<body>
  <div class="error-page">
    <div>
      <p class="error-page__code">{% block error_code %}{% endblock %}</p>
      <p class="error-page__text">{% block error_text %}{% endblock %}</p>
      {% block error_cta %}{% endblock %}
    </div>
  </div>
</body>
</html>
