{% load i18n %}
<div class="modal" id="lead-modal" data-modal data-modal-id="lead" hidden>
  <div class="modal__dialog" role="dialog" aria-modal="true" aria-labelledby="lead-modal-title" data-modal-dialog>
    <div class="modal__head">
      <h2 class="modal__title" id="lead-modal-title">{% trans "Оставить заявку" %}</h2>
      <button type="button" class="modal__close" data-close-modal aria-label="{% trans 'Закрыть' %}">✕</button>
    </div>
    <div id="lead-form-body">
      {% include "partials/lead-form.html" with form=lead_form|default:None service_label="" %}
    </div>
  </div>
</div>
