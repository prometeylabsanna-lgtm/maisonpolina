{% load site_content %}
<div class="lead-success">
  <svg width="56" height="56" viewBox="0 0 56 56" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><circle cx="28" cy="28" r="26"></circle><path d="M17 29l8 8 15-18"></path></svg>
  <p class="lead-success__title">{% block_plain "site" title_key %}</p>
  <div class="lead-success__text">{% block_html "site" text_key %}</div>
  {% if success_kind == "lead" %}
  {% if form_target == "#contacts-form" %}
  <button type="button"
          class="btn lead-success__action"
          hx-get="{% url 'leads:form' %}?form_target=%23contacts-form&source=contacts"
          hx-target="#contacts-form"
          hx-swap="innerHTML">
    {% block_plain "site" "ui.close" %}
  </button>
  {% else %}
  <button type="button"
          class="btn lead-success__action"
          data-close-modal
          hx-get="{% url 'leads:form' %}?form_target=%23lead-form-body"
          hx-target="#lead-form-body"
          hx-swap="innerHTML">
    {% block_plain "site" "ui.close" %}
  </button>
  {% endif %}
  {% else %}
  <button type="button"
          class="btn lead-success__action"
          data-close-modal
          hx-get="{% url 'reviews:form' %}"
          hx-target="#review-form-body"
          hx-swap="innerHTML">
    {% block_plain "site" "ui.close" %}
  </button>
  {% endif %}
</div>
