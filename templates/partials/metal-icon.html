{% load static %}
{# Металеві іконки: рамка + символ, як icon-telegram-metal #}
<svg class="metal-icon" viewBox="0 0 48 48" width="{{ size|default:40 }}" height="{{ size|default:40 }}" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="{{ gid }}-g" x1="6" y1="4" x2="42" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f3e2b0"/>
      <stop offset="22%" stop-color="#e0c57a"/>
      <stop offset="48%" stop-color="#c9a962"/>
      <stop offset="72%" stop-color="#9a7a3c"/>
      <stop offset="100%" stop-color="#e8d48a"/>
    </linearGradient>
    <pattern id="{{ gid }}-h" width="3.2" height="3.2" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <rect width="3.2" height="3.2" fill="#8f7238"/>
      <rect width="1.15" height="3.2" fill="#f0e0a8"/>
      <rect x="1.5" width="0.85" height="3.2" fill="#c9a962"/>
    </pattern>
    <linearGradient id="{{ gid }}-shine" x1="8" y1="6" x2="28" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff6d4" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#c9a962" stop-opacity="0"/>
    </linearGradient>
  </defs>
  {# тінь рамки #}
  <rect x="5.2" y="5.6" width="37.6" height="37.6" rx="9" fill="none" stroke="rgb(0 0 0 / 0.35)" stroke-width="2.6"/>
  <rect x="4.8" y="4.8" width="38.4" height="38.4" rx="9" fill="none" stroke="url(#{{ gid }}-h)" stroke-width="2.5"/>
  <rect x="4.8" y="4.8" width="38.4" height="38.4" rx="9" fill="none" stroke="url(#{{ gid }}-g)" stroke-width="2.5" opacity="0.55"/>

  {% if kind == "telegram" %}
  <path fill="none" stroke="url(#{{ gid }}-h)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"
        d="M14.2 23.2L33.8 14.6c.9-.4 1.7.4 1.3 1.3l-6.4 17.2c-.35.95-1.55.95-1.95.1l-3.35-7.05-7.1-3.2c-.95-.42-.9-1.8.1-2.15z"/>
  <path fill="none" stroke="url(#{{ gid }}-g)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" opacity="0.65"
        d="M14.2 23.2L33.8 14.6c.9-.4 1.7.4 1.3 1.3l-6.4 17.2c-.35.95-1.55.95-1.95.1l-3.35-7.05-7.1-3.2c-.95-.42-.9-1.8.1-2.15z"/>
  <path fill="none" stroke="url(#{{ gid }}-shine)" stroke-width="1.2" stroke-linecap="round" d="M17.2 24.1L31.5 16.8"/>
  {% elif kind == "instagram" %}
  <rect x="15" y="15" width="18" height="18" rx="5" fill="none" stroke="url(#{{ gid }}-h)" stroke-width="2.2"/>
  <rect x="15" y="15" width="18" height="18" rx="5" fill="none" stroke="url(#{{ gid }}-g)" stroke-width="2.2" opacity="0.6"/>
  <circle cx="24" cy="24" r="4.6" fill="none" stroke="url(#{{ gid }}-h)" stroke-width="2.1"/>
  <circle cx="24" cy="24" r="4.6" fill="none" stroke="url(#{{ gid }}-g)" stroke-width="2.1" opacity="0.6"/>
  <circle cx="30.2" cy="17.9" r="1.45" fill="url(#{{ gid }}-h)"/>
  <circle cx="30.2" cy="17.9" r="1.45" fill="url(#{{ gid }}-g)" opacity="0.55"/>
  {% elif kind == "whatsapp" %}
  <path fill="none" stroke="url(#{{ gid }}-h)" stroke-width="2.2" stroke-linejoin="round"
        d="M15.2 32.8l1.15-3.4A8.1 8.1 0 1 1 18.4 31.6z"/>
  <path fill="none" stroke="url(#{{ gid }}-g)" stroke-width="2.2" stroke-linejoin="round" opacity="0.6"
        d="M15.2 32.8l1.15-3.4A8.1 8.1 0 1 1 18.4 31.6z"/>
  <path fill="none" stroke="url(#{{ gid }}-h)" stroke-width="2" stroke-linecap="round"
        d="M19.4 21.2c.25 1.7 1.55 3.35 3.45 4"/>
  <path fill="none" stroke="url(#{{ gid }}-g)" stroke-width="2" stroke-linecap="round" opacity="0.6"
        d="M19.4 21.2c.25 1.7 1.55 3.35 3.45 4"/>
  <circle cx="23.2" cy="25.4" r="1.35" fill="url(#{{ gid }}-h)"/>
  <circle cx="23.2" cy="25.4" r="1.35" fill="url(#{{ gid }}-g)" opacity="0.5"/>
  {% endif %}
</svg>
