{% load site_content %}
{% if error == "rate_limited" %}
<p class="chat-widget__error" role="alert">{% block_plain "site" "chat.error_rate" %}</p>
{% elif error == "session" %}
<p class="chat-widget__error" role="alert">{% block_plain "site" "chat.error_session" %}</p>
{% else %}
<p class="chat-widget__error" role="alert">{% block_plain "site" "chat.error_send" %}</p>
{% endif %}
