{% load i18n site_content %}
<form class="form"
      method="post"
      action="{% url 'reviews:submit' %}"
      hx-post="{% url 'reviews:submit' %}"
      hx-target="#review-form-body"
      hx-swap="innerHTML"
      novalidate
      data-review-form>
  {% csrf_token %}
  {% if form and form.non_field_errors %}
  <div class="form__errors">{{ form.non_field_errors }}</div>
  {% endif %}
  <label class="form__field{% if form and form.name.errors %} form__field--error{% endif %}">
    {% block_plain "site" "review.form_name" %}
    <input class="form__input{% if form and form.name.errors %} form__input--error{% endif %}"
           type="text"
           name="name"
           required
           maxlength="128"
           value="{% if form %}{{ form.name.value|default:'' }}{% endif %}"
           autocomplete="name"
           data-validate="name"
           aria-invalid="{% if form and form.name.errors %}true{% else %}false{% endif %}">
    <span class="form__field-error" data-field-error role="alert" aria-live="polite"{% if not form or not form.name.errors %} hidden{% endif %}>{% if form %}{{ form.name.errors.0 }}{% endif %}</span>
  </label>
  <fieldset class="form__field rating-field">
    <legend class="rating-field__legend">{% block_plain "site" "review.form_rating" %}</legend>
    <div class="rating" data-rating role="radiogroup" aria-label="{% block_plain 'site' 'review.form_rating' %}">
      {% for star in "12345" %}
      <button type="button"
              class="rating__star"
              data-rating-value="{{ forloop.counter }}"
              role="radio"
              aria-checked="false"
              aria-label="{% blocktrans with n=forloop.counter %}{{ n }} из 5{% endblocktrans %}">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" aria-hidden="true">
          <path d="M12 3.2l2.4 4.86 5.36.78-3.88 3.78.92 5.34L12 15.5l-4.8 2.52.92-5.34-3.88-3.78 5.36-.78L12 3.2z"></path>
        </svg>
      </button>
      {% endfor %}
    </div>
    <input type="hidden"
           name="rating"
           value="{% if form and form.rating.value %}{{ form.rating.value }}{% else %}5{% endif %}"
           data-rating-input>
    {% if form and form.rating.errors %}<span class="form__field-error">{{ form.rating.errors.0 }}</span>{% endif %}
  </fieldset>
  <label class="form__field{% if form and form.text.errors %} form__field--error{% endif %}">
    {% block_plain "site" "review.form_text" %}
    <textarea class="form__textarea{% if form and form.text.errors %} form__input--error{% endif %}"
              name="text"
              rows="4"
              required
              maxlength="1200"
              data-validate="review"
              aria-invalid="{% if form and form.text.errors %}true{% else %}false{% endif %}">{% if form %}{{ form.text.value|default:'' }}{% endif %}</textarea>
    <span class="form__field-error" data-field-error role="alert" aria-live="polite"{% if not form or not form.text.errors %} hidden{% endif %}>{% if form %}{{ form.text.errors.0 }}{% endif %}</span>
  </label>
  <input type="hidden" name="language" value="{% if form %}{{ form.language.value|default:current_language|default:'ru' }}{% else %}{{ current_language|default:'ru' }}{% endif %}">
  <input type="hidden" name="form_ts" value="{% if form %}{{ form.form_ts.value|default:'' }}{% endif %}" data-review-ts>
  <div class="honeypot" aria-hidden="true">
    <label>{% block_plain "site" "form.honeypot" %}<input type="text" name="website" tabindex="-1" autocomplete="off"></label>
  </div>
  <button type="submit" class="btn btn--solid btn--block">{% block_plain "site" "review.submit" %}</button>
</form>
