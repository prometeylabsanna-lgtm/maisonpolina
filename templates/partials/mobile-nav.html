{% load site_content %}
<div class="mobile-nav" id="mobile-nav" data-mobile-nav hidden>
  <div class="mobile-nav__top">
    <span class="header__brand-mark">
      <span class="header__brand-line">{% block_plain "site" "header.brand_line_1" %}</span>
      <span class="header__brand-line">{% block_plain "site" "header.brand_line_2" %}</span>
    </span>
    <button type="button" class="mobile-nav__close" data-mobile-nav-close aria-label="{% block_plain 'site' 'mobile.close' %}">✕</button>
  </div>
  <nav class="mobile-nav__list" aria-label="{% block_plain 'site' 'mobile.nav_aria' %}">
    {% include "partials/site-nav-links.html" with link_attrs="data-mobile-nav-link" %}
  </nav>
  <div class="mobile-nav__bottom">
    {% if site_settings.phone %}
    <a class="mobile-nav__phone" href="tel:{{ site_settings.phone|cut:' '|cut:'-' }}">{{ site_settings.phone }}</a>
    {% endif %}
    <button type="button" class="btn btn--block" data-open-lead data-source="header" data-service="" data-mobile-nav-link>
      {% block_plain "site" "header.cta" %}
    </button>
  </div>
</div>
