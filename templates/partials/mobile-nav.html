{% load i18n %}
{% url 'core:home' as home_url %}
<div class="mobile-nav" id="mobile-nav" data-mobile-nav hidden>
  <div class="mobile-nav__top">
    <span class="header__brand-mark">
      <span class="header__brand-line">MAISON</span>
      <span class="header__brand-line">POLINA</span>
    </span>
    <button type="button" class="mobile-nav__close" data-mobile-nav-close aria-label="{% trans 'Закрыть' %}">✕</button>
  </div>
  <nav class="mobile-nav__list" aria-label="{% trans 'Мобильная навигация' %}">
    <a href="{{ home_url }}#about" data-mobile-nav-link>{% trans "Обо мне" %}</a>
    <a href="{{ home_url }}#gallery" data-mobile-nav-link>{% trans "Галерея" %}</a>
    <a href="{{ home_url }}#services" data-mobile-nav-link>{% trans "Услуги" %}</a>
    <a href="{{ home_url }}#reviews" data-mobile-nav-link>{% trans "Отзывы" %}</a>
    <a href="{{ home_url }}#faq" data-mobile-nav-link>{% trans "Вопросы" %}</a>
    <a href="{{ home_url }}#contact" data-mobile-nav-link>{% trans "Контакты" %}</a>
  </nav>
  <div class="mobile-nav__bottom">
    {% if site_settings.phone %}
    <a class="mobile-nav__phone" href="tel:{{ site_settings.phone|cut:' '|cut:'-' }}">{{ site_settings.phone }}</a>
    {% endif %}
    <button type="button" class="btn btn--block" data-open-lead data-source="header" data-service="" data-mobile-nav-link>
      {% trans "Заявка" %}
    </button>
  </div>
</div>
